name: Unity self-hosted gates

# Runs every automated Unity gate on a machine the maintainer controls: a computer
# with Unity installed and registered as a GitHub self-hosted runner labelled
# "unity". Manual dispatch only. A self-hosted runner must never execute code from
# fork pull requests, so this workflow deliberately declares no pull_request or
# push trigger. The runner needs Python 3.11+ and a Unity Editor reachable through
# UNITY_EDITOR or the Unity Hub default install folder.

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Host to generate: reference-system, all, or a comma-separated list of package ids"
        required: false
        default: "all"
      mode:
        description: "all, EditMode, or PlayMode"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: unity-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-gates:
    name: run-gates
    runs-on: [self-hosted, unity]
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned contract dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/contract-requirements.txt
      - name: Run the Unity gates
        run: python scripts/run_unity_gates.py --host "${{ inputs.host }}" --mode "${{ inputs.mode }}" --output "${RUNNER_TEMP}/unity-gates"
      - name: Upload the receipt, results, and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-gates-${{ github.run_id }}
          path: ${{ runner.temp }}/unity-gates
          if-no-files-found: warn
          retention-days: 30
