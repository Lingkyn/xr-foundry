name: Validate packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-contract-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/contract-requirements.txt
      - name: Install contract validator dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/contract-requirements.txt
      - name: Validate repository, package, and test contracts
        run: python scripts/validate_repository.py --json --run-contract-tests

  repository-contract:
    name: repository-contract
    if: ${{ always() }}
    needs: python-contract-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: none
    steps:
      - name: Require every Python contract job to pass
        env:
          CONTRACT_MATRIX_RESULT: ${{ needs.python-contract-matrix.result }}
        run: test "$CONTRACT_MATRIX_RESULT" = success
