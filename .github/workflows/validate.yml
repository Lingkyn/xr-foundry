name: Validate packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-contract-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/contract-requirements.txt
      - name: Install contract validator dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/contract-requirements.txt
      - name: Validate repository, package, and test contracts
        run: python scripts/validate_repository.py --json --run-contract-tests

  merge-readiness:
    name: merge-readiness
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the pull-request merge commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/contract-requirements.txt
      - name: Install contract validator dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/contract-requirements.txt
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Collect pull-request review metadata (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            -o pr-reviews.json
      - name: Compute the merge-readiness verdict
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python scripts/merge_readiness.py \
            --base "origin/$BASE_REF" --head HEAD --head-branch "$HEAD_REF" \
            --github-reviews pr-reviews.json --pr-author "$PR_AUTHOR" --pr-draft "$PR_DRAFT" \
            --reviews-informational \
            --output merge-readiness/verdict.json --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Require process-merge eligibility on mandated branches
        run: |
          python - <<'PY'
          import json, pathlib
          verdict = json.loads(pathlib.Path("merge-readiness/verdict.json").read_text(encoding="utf-8"))
          mandated = next(c for c in verdict["checks"] if c["id"] == "mandated_branch")
          if mandated["status"] == "pass" and not verdict["process_merge_eligible"]:
              raise SystemExit("mandated branch is not process-merge eligible: " + ", ".join(verdict["blocking"] + verdict["unknown"]) + f" (class {verdict['decision_class']})")
          print("process_merge_eligible:", verdict["process_merge_eligible"])
          PY
      - name: Upload the verdict
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-readiness-verdict
          path: merge-readiness/verdict.json
          if-no-files-found: ignore

  repository-contract:
    name: repository-contract
    if: ${{ always() }}
    needs: python-contract-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: none
    steps:
      - name: Require every Python contract job to pass
        env:
          CONTRACT_MATRIX_RESULT: ${{ needs.python-contract-matrix.result }}
        run: test "$CONTRACT_MATRIX_RESULT" = success
